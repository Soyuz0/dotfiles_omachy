set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g allow-passthrough on
set -g set-clipboard on
unbind C-b
set -g prefix C-m
set -g prefix2 C-a
# bind C-m send-prefix

# Next window with Ctrl-]
bind-key -n C-] next-window
# bind -n 'Ò' next-window

# Previous window with Ctrl-[
bind-key -n C-[ previous-window
# bind -n 'Ó' previous-window

# Next session with Ctrl-)
bind-key -n C-) switch-client -n

# Previous session with Ctrl-(
bind-key -n C-( switch-client -p

# Session picker with Ctrl-s (same as <prefix> s)
bind-key -n C-s choose-tree -Zs

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Persistence policy: metadata saves only, never automatically replay jobs.
# Guard below must establish this exact private directory before plugins load.
set -g @resurrect-dir "$HOME/.local/state/tmux-resurrect"
set -g @resurrect-save 'S'
set -g @resurrect-restore 'U'
set -g @resurrect-processes 'false'
set -g @resurrect-never-overwrite 'on'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-save-shell-history 'off'
set -g @resurrect-save-bash-history 'off'
set -g @continuum-save-interval '60'
set -g @continuum-restore 'off'
set -g @continuum-boot 'off'

# setup_tmux_persistence.sh prepares private state and checks peeled source pins.
# resurrect v4.0.0: e87d7d592cac97fa38c12395ebec042c154a1844
# continuum v3.1.0: 46e0e0023476018ddb4cc0d44783eede27e5a8ec
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
# Continuum must be the last plugin declaration, after status-line plugins.
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'

# TPM sources installed plugins only; it does not fetch missing ones on reload.
# Without TPM, load just these two optional plugins in dependency order.
# The fallback and TPM are mutually exclusive to avoid duplicate initialization.
# Fail closed if the private-state guard is absent or rejects the directory.
run-shell 'if ! "$HOME/.config/tmux/prepare-persistence-state.py"; then printf "%s\\n" "tmux persistence: private state unavailable; plugins not loaded" >&2; exit 1; fi; if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; elif [ -x "$HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux" ]; then "$HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux"; if [ -x "$HOME/.tmux/plugins/tmux-continuum/continuum.tmux" ]; then "$HOME/.tmux/plugins/tmux-continuum/continuum.tmux"; fi; fi'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Preserve Ctrl+Shift keys for Pi; apply after plugin defaults.
source-file -q ~/.pi/scripts/tmux-pi-keys.conf

# Use Pi's short conversation label for automatic window names.
source-file -q ~/.pi/scripts/tmux-pi-window-name.conf
